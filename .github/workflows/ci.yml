name: CI / Build & ISO Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel, Ring 3 App & ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: Install Build Dependencies (xorriso, mtools)
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools gcc make python3

      - name: Build Jinn Kernel (Ring 0)
        run: |
          cargo build --release --target x86_64-unknown-none -Zbuild-std=core,alloc

      - name: Build Ring 3 User Application (ola-mundo)
        run: |
          cd apps/ola-mundo
          cargo +nightly build --release -Zjson-target-spec -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem
          cd ../..

      - name: Prepare ISO root structure
        run: |
          mkdir -p boot iso_root/boot iso_root/apps iso_root/EFI/BOOT
          cp target/x86_64-unknown-none/release/jinn boot/kernel.elf
          cp target/x86_64-unknown-none/release/jinn iso_root/boot/kernel.elf
          cp apps/ola-mundo/target/x86_64-jinn-user/release/ola-mundo iso_root/apps/ola-mundo.elf

      - name: Generate FAT32 Virtual Disk Image (disk.img)
        run: |
          python3 scripts/make_disk.py

      - name: Setup Limine Bootloader
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1
          make -C limine
          cp limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/boot/
          cp limine/BOOTX64.EFI iso_root/EFI/BOOT/

      - name: Create Hybrid Bootable ISO (jinn.iso)
        run: |
          xorriso -as mkisofs -b boot/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            iso_root -o jinn.iso
          ./limine/limine bios-install jinn.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinn-bootable-iso
          path: jinn.iso
          retention-days: 14

      - name: Upload FAT32 Disk Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinn-fat32-disk
          path: disk.img
          retention-days: 14
