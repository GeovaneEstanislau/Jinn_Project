name: CLA Check

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'Li o CLA v1.0 do Jinn Project e concordo com seus termos.'
        )
      )
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Verify and collect CLA signatures
        uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/GeovaneEstanislau/Jinn_Project/blob/main/CLA.md
          branch: cla-signatures
          custom-pr-sign-comment: Li o CLA v1.0 do Jinn Project e concordo com seus termos.
